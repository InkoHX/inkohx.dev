name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Pre-build devShell
        run: nix build --no-link .#devShells.$(nix eval --impure --raw --expr 'builtins.currentSystem').default

      - name: Install dependencies
        shell: 'nix develop -c bash -e {0}'
        run: pnpm install

      - name: Run linter
        shell: 'nix develop -c bash -e {0}'
        run: pnpm run lint

  deploy-preview:
    name: Deploy to preview
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.ref != 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Pre-build devShell
        run: nix build --no-link .#devShells.$(nix eval --impure --raw --expr 'builtins.currentSystem').default

      - name: Install dependencies
        shell: 'nix develop -c bash -e {0}'
        run: pnpm install

      - name: Deploy to preview
        id: deploy-result
        shell: 'nix develop -c bash -e {0}'
        # 参考: https://github.com/netlify/actions/blob/3eff4d5cd9bf9f7ba528c1f1bbb94a37c3a3201d/cli/entrypoint.sh
        run: |
          OUTPUT=$(pnpm netlify deploy --build --context deploy-preview 2>&1)
          COMMAND_EXIT_CODE=$?

          if [ $COMMAND_EXIT_CODE -ne 0 ]; then
            echo "$OUTPUT"
            exit $COMMAND_EXIT_CODE
          fi

          NETLIFY_URL=$(echo "$OUTPUT" | grep -Eo '(http|https)://[a-zA-Z0-9./?=_-]*(--)[a-zA-Z0-9./?=_-]*')

          echo "url=$NETLIFY_URL" >> $GITHUB_OUTPUT

          delimiter="$(openssl rand -hex 8)"
          echo "logs_url<<$delimiter" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" | grep -Eo '(http|https)://app.netlify.com/[a-zA-Z0-9./?=_-]*' >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"

          echo "$OUTPUT"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Comment to commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'push'
        with:
          script: |
            const liveUrl = process.env.NETLIFY_URL;
            const logsUrl = process.env.NETLIFY_LOGS_URL;

            github.rest.repos.createCommitComment({
              ...context.repo,
              commit_sha: context.sha,
              body: [
                `# Deployed to ${liveUrl}`,
                '## Logs',
                ...logsUrl.split('\n').map(url => `- ${url}`)
              ].join('\n')
            });
        env:
          NETLIFY_URL: ${{ steps.deploy-result.outputs.url }}
          NETLIFY_LOGS_URL: ${{ steps.deploy-result.outputs.logs_url }}

      - name: Comment to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const commentTag = '<!-- thollander/actions-comment-pull-request "netlify-deploy-preview" -->';
            const issueNumber = context.issue.number;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
            });
            const existingComment = comments.find((comment) => comment.body?.includes(commentTag));
            const logsUrl = process.env.NETLIFY_LOGS_URL ?? '';
            const body = [
              `# Deployed to ${process.env.NETLIFY_URL}`,
              '## Logs',
              ...logsUrl.split('\n').map((url) => `- ${url}`),
              commentTag,
            ].join('\n');

            if (existingComment) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: existingComment.id,
              });
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body,
            });
        env:
          NETLIFY_URL: ${{ steps.deploy-result.outputs.url }}
          NETLIFY_LOGS_URL: ${{ steps.deploy-result.outputs.logs_url }}

  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Pre-build devShell
        run: nix build --no-link .#devShells.$(nix eval --impure --raw --expr 'builtins.currentSystem').default

      - name: Install dependencies
        shell: 'nix develop -c bash -e {0}'
        run: pnpm install

      - name: Deploy to production
        id: deploy-result
        shell: 'nix develop -c bash -euxo pipefail {0}'
        # 参考: https://github.com/netlify/actions/blob/3eff4d5cd9bf9f7ba528c1f1bbb94a37c3a3201d/cli/entrypoint.sh
        run: |
          OUTPUT=$(pnpm netlify deploy --prod --build --context production 2>&1)
          COMMAND_EXIT_CODE=$?

          if [ $COMMAND_EXIT_CODE -ne 0 ]; then
            echo "$OUTPUT"
            exit $COMMAND_EXIT_CODE
          fi

          NETLIFY_URL=$(echo "$OUTPUT" | grep 'netlify.app' | grep -Eo '(http|https)://[a-zA-Z0-9./?=_-]*')

          echo "url=$NETLIFY_URL" >> $GITHUB_OUTPUT

          delimiter="$(openssl rand -hex 8)"
          echo "logs_url<<$delimiter" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" | grep -Eo '(http|https)://app.netlify.com/[a-zA-Z0-9./?=_-]*' >> "$GITHUB_OUTPUT"
          echo "$delimiter" >> "$GITHUB_OUTPUT"

          echo "$OUTPUT"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Comment to commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const liveUrl = process.env.NETLIFY_URL;
            const logsUrl = process.env.NETLIFY_LOGS_URL;

            github.rest.repos.createCommitComment({
              ...context.repo,
              commit_sha: context.sha,
              body: [
                `# Deployed to ${liveUrl}`,
                '## Logs',
                ...logsUrl.split('\n').map(url => `- ${url}`)
              ].join('\n')
            });
        env:
          NETLIFY_URL: ${{ steps.deploy-result.outputs.url }}
          NETLIFY_LOGS_URL: ${{ steps.deploy-result.outputs.logs_url }}
