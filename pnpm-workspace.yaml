minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@eslint-react/ast@5.28.1'
  - '@eslint-react/core@5.28.1'
  - '@eslint-react/eslint-plugin@5.28.1'
  - '@eslint-react/eslint@5.28.1'
  - '@eslint-react/jsx@5.28.1'
  - '@eslint-react/shared@5.28.1'
  - '@eslint-react/var@5.28.1'
  - eslint-plugin-react-dom@5.28.1
  - eslint-plugin-react-jsx@5.28.1
  - eslint-plugin-react-naming-convention@5.28.1
  - eslint-plugin-react-rsc@5.28.1
  - eslint-plugin-react-web-api@5.28.1
  - eslint-plugin-react-x@5.28.1

trustPolicy: no-downgrade
shellEmulator: true

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  netlify-cli: true
  sharp: true
  unix-dgram: false
